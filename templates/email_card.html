<div class="email-card">
    <div class="email-toolbar">
        <span class="email-dot email-dot-red"></span>
        <span class="email-dot email-dot-yellow"></span>
        <span class="email-dot email-dot-green"></span>
    </div>
    <div class="email-inner">
        <div class="email-sender-row">
            <div class="email-avatar-circle">{sender_letter}</div>
            <div class="email-meta">
                <div class="email-header"><strong>De :</strong> <span class="email-sender-addr">{sender}</span></div>
                <div class="email-header"><strong>À :</strong> {recipient}</div>
            </div>
        </div>
        <div class="email-subject">{subject}</div>
        <div class="email-body-text">{body}</div>
    </div>
</div>
